<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bağlantı yok - MAMA AURA Paket</title>
    <meta name="theme-color" content="#F5F7F6" />
    <!--
      Service worker'ın çevrimdışı yedeği. CSS dosyası YOK (ağ yok), stil
      satır içi. Renkler globals.css "Mürekkep & Nane" token'larıyla elle
      eşlenir; tek açık tema (DESIGN.md "Tema"). Kelime işareti önbellekte
      (sw.js ASSETS) — orada olmazsa kırık resim çıkar, bu yüzden listede.
    -->
    <style>
      :root {
        --bg: #f5f7f6;
        --fg: #0f1b2d;
        --muted: #5c6878;
        --card: #ffffff;
        --line: #dfe4e8;
        --accent: #0f8a5f;
        --accent-soft: #e4f5ee;
        --accent-bright: #12a874;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font: 500 0.9375rem/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, system-ui, sans-serif;
      }
      .kart {
        width: 100%;
        max-width: 24rem;
        padding: 2rem 1.75rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 1px 2px rgb(15 27 45 / 0.06), 0 4px 12px -4px rgb(15 27 45 / 0.08);
      }
      .marka {
        display: block;
        width: 160px;
        height: 20px;
        margin: 0 auto 1.5rem;
      }
      .ikon {
        width: 3.25rem;
        height: 3.25rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 12px;
        color: var(--accent-bright);
        background: var(--accent-soft);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.3125rem;
        line-height: 1.22;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      p { margin: 0; color: var(--muted); font-size: 0.875rem; }
      button {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main class="kart">
      <img class="marka" src="/marka/mamaaura.png" alt="MAMA AURA" width="160" height="20" />
      <div class="ikon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2l20 20" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.61" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5.09A15 15 0 0 1 22 8.82" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>Bağlantı yok</h1>
      <p>
        MAMA AURA Paket canlı veriyle çalışır - paket, stok ve sipariş
        bilgileri çevrimdışı gösterilmez. Bağlantı geri geldiğinde kaldığınız
        yerden devam edin.
      </p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
